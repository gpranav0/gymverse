  /api/chat:
    post:
      summary: Ask the AI assistant
      description: |
        Requires a logged-in user and is rate limited to 15 requests per account per
        15 minutes, because every call spends money on the gym's own AI keys. Gemini is
        tried first with Groq as a fallback. Standalone questions are cached for 10
        minutes; follow-ups that carry `conversationHistory` are never served from cache.

        When MongoDB chat history is connected, each exchange is saved under the
        authenticated user. Send `temporary: true` for a conversation that must not be
        kept: it is never saved and bypasses the reply cache, even with history connected.
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                conversationHistory:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, model, assistant] }
                      content: { type: string, minLength: 1, maxLength: 4000 }
                conversationId: { type: string, format: uuid, description: Conversation to append to; generated if omitted. }
                requestId: { type: string, format: uuid, description: Idempotency key; a retry with the same value is not saved twice. }
                gapBefore: { type: boolean, description: Earlier messages in this conversation were not saved. }
                temporary:
                  type: boolean
                  default: false
                  description: Temporary chat. Never saved and never cached. Must be a JSON boolean.
      responses:
        '200':
          description: Assistant reply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  response: { type: string }
                  source: { type: string, enum: [ai, cache] }
                  conversationId: { type: string, format: uuid }
                  requestId: { type: string, format: uuid }
                  persistence:
                    type: object
                    properties:
                      saved: { type: boolean }
                      temporary: { type: boolean, description: Present and true for temporary chats. }
                      available: { type: boolean, description: Whether chat history storage is connected. }
                      configured: { type: boolean }
        '400': { description: Missing or oversized message. }
        '422': { description: Invalid body, e.g. a non-boolean `temporary`. }
        '429': { description: Rate limit exceeded. }
        '500': { description: All AI providers failed or none is configured. }
